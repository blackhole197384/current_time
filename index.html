<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tidbyt Style Matrix Panel 64x48</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100vw;
        height: 100vh;
        background-color: #000000;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1cm;
        user-select: none;
        -webkit-user-select: none;
    }
    
    canvas {
        display: block;
        width: 100%;
        height: 100%;
        max-width: calc(100vw - 2cm);
        max-height: calc(100vh - 2cm);
        aspect-ratio: 4 / 3;
        object-fit: contain;
        filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.25));
    }
</style>
</head>
<body>

<canvas id="matrixCanvas"></canvas>

<script>
// ==========================================
// 1. iPad 4:3 專屬網格配置 (64x48, 2048x1536)
// ==========================================
const COLS = 64;
const ROWS = 48; 
const canvas = document.getElementById('matrixCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

const CELL_SIZE = 32; 
const DOT_SIZE = 24;  
const DOT_GAP = 8;    

canvas.width = COLS * CELL_SIZE;  
canvas.height = ROWS * CELL_SIZE; 

const backplate = document.createElement('canvas');
backplate.width = canvas.width;
backplate.height = canvas.height;
const bgCtx = backplate.getContext('2d', { alpha: false });

bgCtx.fillStyle = '#050505';
bgCtx.fillRect(0, 0, backplate.width, backplate.height);

bgCtx.fillStyle = '#111111';
for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
        let x = c * CELL_SIZE + CELL_SIZE / 2;
        let y = r * CELL_SIZE + CELL_SIZE / 2;
        bgCtx.beginPath();
        bgCtx.arc(x, y, DOT_SIZE / 2, 0, Math.PI * 2);
        bgCtx.fill();
    }
}

// ==========================================
// 2. 超大時鐘與天氣專用字庫
// ==========================================
const hugeFont = {
    '0': ['011111110','111111111','111000111','110000011','110000011','110000011','110000011','110000011','110000011','110000011','110000011','110000011','110000011','110000011','111000111','111111111','011111110'],
    '1': ['0001100','0011100','0111100','1101100','0001100','0001100','0001100','0001100','0001100','0001100','0001100','0001100','0001100','0001100','0001100','1111111','1111111'],
    '2': ['011111110','111111111','111000111','110000011','000000011','000000111','000001110','000011100','000111000','001110000','011100000','111000000','110000000','110000000','110000000','111111111','111111111'],
    '3': ['011111110','111111111','111000111','110000011','000000011','000000011','000000111','000111110','000111110','000000111','000000011','000000011','000000011','110000011','111000111','111111111','011111110'],
    '4': ['000000110','000001110','000011110','000110110','001100110','011000110','110000110','110000110','111111111','111111111','000000110','000000110','000000110','000000110','000000110','000000110','000000110'],
    '5': ['111111111','111111111','110000000','110000000','110000000','111111110','111111111','000000011','000000011','000000011','000000011','000000011','000000011','110000011','111000111','111111111','011111110'],
    '6': ['001111111','011111111','111000000','110000000','110000000','110000000','111111110','111111111','111000111','110000011','110000011','110000011','110000011','110000011','111000111','111111111','011111110'],
    '7': ['111111111','111111111','000000011','000000111','000001110','000011100','000111000','001110000','011100000','111000000','111000000','110000000','110000000','110000000','110000000','110000000','110000000'],
    '8': ['011111110','111111111','111000111','110000011','110000011','111000111','011111110','001111100','011111110','111000111','110000011','110000011','110000011','110000011','111000111','111111111','011111110'],
    '9': ['011111110','111111111','111000111','110000011','110000011','110000011','110000011','111000111','111111111','011111111','000000011','000000011','000000011','000000011','000000111','111111111','111111100'],
    ':': ['0000','0000','0000','0110','0110','0000','0000','0000','0000','0000','0000','0110','0110','0000','0000','0000','0000']
};

const miniFont = {
    '0': ['111','101','101','101','111'],
    '1': ['010','110','010','010','111'],
    '2': ['111','001','111','100','111'],
    '3': ['111','001','111','001','111'],
    '4': ['101','101','111','001','001'],
    '5': ['111','100','111','001','111'],
    '6': ['111','100','111','101','111'],
    '7': ['111','001','010','100','100'],
    '8': ['111','101','111','101','111'],
    '9': ['111','101','111','001','111'],
    'C': ['111','100','100','100','111'],
    '%': ['11001','11010','00100','01011','10011'],
    '-': ['000','000','111','000','000'],
    '.': ['00','00','00','00','11'],
    ' ': ['00','00','00','00','00'],
    '°': ['111','101','111','000','000'],
    'S': ['111','100','111','001','111'],
    'U': ['101','101','101','101','111'],
    'N': ['1001','1101','1011','1001','1001'],
    'M': ['10001','11011','10101','10001','10001'],
    'T': ['111','010','010','010','010'],
    'W': ['10001','10001','10101','11011','10001'],
    'F': ['111','100','110','100','100'],
    'H': ['101','101','111','101','101'],
    'A': ['111','101','111','101','101'],
    'P': ['111','101','111','100','100'],
    'R': ['111','101','110','101','101']
};

const hourColors = ['#FF0000','#FF7F00','#FFD700','#7FFF00','#00FF00','#00FF7F','#00FFFF','#007FFF','#0000FF','#7F00FF','#FF00FF','#FF007F'];

// ==========================================
// 3. 吃豆人與天氣精靈圖標
// ==========================================
const pacmanMini = [
    ['001111000','011111100','111111110','111111111','111110000','111111111','111111110','011111100','001111000'],
    ['001111000','011111100','111111110','111111111','111111111','111111111','111111110','011111100','001111000']
];
const ghostMini = ['001111100','011111110','112212211','113213211','111111111','111111111','111111111','111111111','101010101'];

const iconSunny = [
    '00000100000','00100100100','00010001000','01001110010','00011111000',
    '11011111011','00011111000','01001110010','00010001000','00100100100','00000100000'
];
const iconCloudy = [
    '00000000000','00000222000','00002222200','00022222220','00222222220',
    '02222222222','02222222222','00222222200','00000000000','00000000000','00000000000'
];
const iconPartlyCloudy = [
    '00000100000','00100101000','00011110000','01011111000','00011222000',
    '00022222200','00222222220','02222222222','02222222222','00222222200','00000000000'
];
const iconRain = [
    '00002220000','00022222000','00222222220','02222222222','02222222222',
    '00222222200','00030030000','00300300300','00030030000','00300003000','00000000000'
];

// ==========================================
// 4. 高清晰中文字點陣光柵器
// ==========================================
const textMatrixCache = {};

function rasterizeTextToMatrix(key, text) {
    if (!text) return;
    const off = document.createElement('canvas');
    const octx = off.getContext('2d', { willReadFrequently: true });
    
    const fontStr = "normal 14px -apple-system, 'PingFang HK', 'Noto Sans TC', 'Heiti TC', sans-serif";
    octx.font = fontStr;
    const textWidth = Math.ceil(octx.measureText(text).width);
    
    off.width = textWidth + 10;
    off.height = 15; 
    
    octx.fillStyle = "#000000";
    octx.fillRect(0, 0, off.width, off.height);
    
    octx.font = fontStr;
    octx.fillStyle = "#ffffff";
    octx.textBaseline = "middle";
    octx.fillText(text, 2, 7);
    
    const imgData = octx.getImageData(0, 0, off.width, off.height);
    const dots = [];
    for (let x = 0; x < off.width; x++) {
        dots[x] = [];
        for (let y = 0; y < off.height; y++) {
            const idx = (y * off.width + x) * 4;
            dots[x][y] = imgData.data[idx] > 145 ? 1 : 0;
        }
    }
    
    textMatrixCache[key] = {
        width: off.width,
        height: 15,
        dots: dots
    };
}

// ==========================================
// 5. 即時資料同步 (天氣、修正後的港鐵班次、4大新聞)
// ==========================================
let weatherTemp = "--";
let weatherHum = "--";
let weatherIconCode = 52;
let mtrRawText = "康城往北角: 正在連線中...";

const NEWS_SOURCES = [
    { label: "港台", url: "https://rthk9.rthk.hk/rthk/news/rss/c_expressnews_clocal.xml" },
    { label: "Yahoo", url: "https://hk.news.yahoo.com/rss/hong-kong" },
    { label: "政府新聞", url: "https://www.news.gov.hk/rss/tc.xml" },
    { label: "SCMP", url: "https://www.scmp.com/rss" }
];

let newsHeadlinePool = [];
let activeHeadlineIndex = 0;

async function fetchWeather() {
    try {
        const hkoRes = await fetch("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc");
        const hkoData = await hkoRes.json();
        
        if (hkoData?.temperature?.data) {
            let t = hkoData.temperature.data.find(s => s.place.includes("將軍澳") || s.place.includes("康城")) || hkoData.temperature.data[0];
            if (t?.value !== undefined) weatherTemp = t.value;
        }
        if (hkoData?.icon?.length > 0) weatherIconCode = hkoData.icon[0];
        
        const omRes = await fetch("https://api.open-meteo.com/v1/forecast?latitude=22.296&longitude=114.271&current=relative_humidity_2m&timezone=Asia%2FHong_Kong");
        const omData = await omRes.json();
        if (omData?.current?.relative_humidity_2m !== undefined) {
            weatherHum = omData.current.relative_humidity_2m;
        } else if (hkoData?.humidity?.data) {
            weatherHum = hkoData.humidity.data[0].value;
        }
    } catch(e) { console.warn("天氣同步異常:", e); }
}

// 修正港鐵離站數據：康城往市區方向為 DOWN 方向
async function fetchMTRSchedule() {
    try {
        const res = await fetch("https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TKL&sta=LHP");
        const json = await res.json();
        
        if (json.status === 1 && json.data && json.data["TKL-LHP"]) {
            const lhp = json.data["TKL-LHP"];
            // 優先取得 DOWN (往北角/調景嶺)，並排除抵達終點的車次
            let rawList = (lhp.DOWN || []).concat(lhp.UP || []);
            let departures = rawList.filter(t => t.dest !== 'LHP');
            
            if (departures.length > 0) {
                const destNames = { 'NOP': '北角', 'TIK': '調景嶺', 'POA': '寶琳', 'TKO': '將軍澳' };
                const next3 = departures.slice(0, 3);
                
                const parts = next3.map(t => {
                    const dest = destNames[t.dest] || t.dest || '北角';
                    let mins = t.ttnt;
                    // Safari 相容處理 (時間格式以斜線取代破折號)
                    if (mins === undefined || mins === null || isNaN(mins)) {
                        const safeTimeStr = (t.time || '').replace(/-/g, '/');
                        mins = Math.max(0, Math.round((new Date(safeTimeStr) - new Date()) / 60000));
                    } else {
                        mins = parseInt(mins, 10);
                    }
                    const minStr = (mins === 0) ? "即將開出" : `${mins}分鐘`;
                    return `${dest} ${minStr}`;
                });
                
                mtrRawText = "康城開出: " + parts.join(" · ");
            } else {
                mtrRawText = "康城站: 列車服務暫停或已過尾班車";
            }
            rasterizeTextToMatrix('mtr', mtrRawText);
        }
    } catch(e) { console.warn("港鐵同步異常:", e); }
}

async function fetchHKNews() {
    let collectedHeadlines = [];
    for (const src of NEWS_SOURCES) {
        try {
            const rssUrl = encodeURIComponent(src.url);
            const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`);
            const data = await res.json();
            
            if (data.status === 'ok' && data.items && data.items.length > 0) {
                for (let i = 0; i < Math.min(2, data.items.length); i++) {
                    let title = data.items[i].title || "";
                    title = title.replace(/<[^>]*>?/gm, '').trim();
                    if (title) {
                        let formatted = `${src.label}: ${title}`;
                        if (formatted.length > 50) formatted = formatted.substring(0, 49) + "…";
                        collectedHeadlines.push(formatted);
                    }
                }
            }
        } catch(e) {}
    }
    
    if (collectedHeadlines.length > 0) {
        newsHeadlinePool = collectedHeadlines;
        renderActiveHeadline();
    } else if (newsHeadlinePool.length === 0) {
        newsHeadlinePool = ["天氣警報: 今日香港無特別警告信號。"];
        renderActiveHeadline();
    }
}

function renderActiveHeadline() {
    if (newsHeadlinePool.length === 0) return;
    const headline = newsHeadlinePool[activeHeadlineIndex % newsHeadlinePool.length];
    rasterizeTextToMatrix('news', headline);
}

fetchWeather();
fetchMTRSchedule();
fetchHKNews();

setInterval(fetchWeather, 5 * 60 * 1000);
setInterval(fetchMTRSchedule, 30 * 1000);
setInterval(fetchHKNews, 8 * 60 * 1000);

function getIconSprite() {
    if (weatherIconCode >= 50 && weatherIconCode <= 52) return iconPartlyCloudy;
    if (weatherIconCode >= 53 && weatherIconCode <= 54) return iconSunny;
    if (weatherIconCode >= 60 && weatherIconCode <= 61) return iconCloudy;
    if (weatherIconCode >= 62 && weatherIconCode <= 65) return iconRain;
    return iconPartlyCloudy;
}

// ==========================================
// 6. 點陣繪製方法
// ==========================================
function drawLitDot(col, row, color) {
    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;
    let x = col * CELL_SIZE + CELL_SIZE / 2;
    let y = row * CELL_SIZE + CELL_SIZE / 2;
    ctx.beginPath();
    ctx.arc(x, y, DOT_SIZE / 2, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
}

function drawSprite(sprite, startX, startY, colorMap) {
    for (let r = 0; r < sprite.length; r++) {
        for (let c = 0; c < sprite[r].length; c++) {
            if (sprite[r][c] !== '0') {
                drawLitDot(Math.floor(startX + c), startY + r, colorMap[sprite[r][c]] || '#FFFFFF');
            }
        }
    }
}

function drawHugeText(text, startX, startY, color) {
    let currX = startX;
    for (let i = 0; i < text.length; i++) {
        let charData = hugeFont[text[i]];
        if (!charData) { currX += 4; continue; }
        
        for (let r = 0; r < charData.length; r++) {
            for (let c = 0; c < charData[r].length; c++) {
                if (charData[r][c] === '1') drawLitDot(currX + c, startY + r, color);
            }
        }
        currX += charData[0].length + 2;
    }
}

function drawMiniText(text, startX, startY, color) {
    let currX = startX;
    for (let i = 0; i < text.length; i++) {
        let sprite = miniFont[text[i]] || miniFont[' '];
        for (let r = 0; r < sprite.length; r++) {
            for (let c = 0; c < sprite[r].length; c++) {
                if (sprite[r][c] === '1') drawLitDot(currX + c, startY + r, color);
            }
        }
        currX += sprite[0].length + 1;
    }
    return currX;
}

function drawRasterText(key, scrollX, startY, color) {
    const cached = textMatrixCache[key];
    if (!cached) return;
    
    const startCol = Math.floor(scrollX);
    for (let c = 0; c < COLS; c++) {
        let srcX = c - startCol;
        if (srcX >= 0 && srcX < cached.width) {
            for (let r = 0; r < cached.height; r++) {
                if (cached.dots[srcX][r] === 1) {
                    drawLitDot(c, startY + r, color);
                }
            }
        }
    }
}

// ==========================================
// 7. 主渲染迴圈
// ==========================================
const DURATION_PACMAN  = 20; 
const DURATION_WEATHER = 60;
const DURATION_MTR     = 25;
const DURATION_NEWS    = 35;
const TOTAL_CYCLE = DURATION_PACMAN + DURATION_WEATHER + DURATION_MTR + DURATION_NEWS; 

let prevCyclePhase = -1;

function animate() {
    ctx.drawImage(backplate, 0, 0);
    
    const now = new Date();
    const currentColor = hourColors[now.getHours() % 12];
    canvas.style.filter = `drop-shadow(0 0 12px ${currentColor}45)`;
    
    // 1. 日期 (第 2 至 6 列)
    const month = (now.getMonth() + 1 < 10 ? '0' : '') + (now.getMonth() + 1);
    const day = (now.getDate() < 10 ? '0' : '') + now.getDate();
    const weekDays = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const dateStr = `${month}.${day}  ${weekDays[now.getDay()]}`;
    
    let dateWidth = 0;
    for(let c of dateStr) dateWidth += (miniFont[c]||miniFont[' '])[0].length + 1;
    dateWidth--;
    drawMiniText(dateStr, Math.floor((COLS - dateWidth) / 2), 2, '#888888');
    
    // 2. 超大時鐘 (第 10 至 26 列，與日期保持 3 行空白留白)
    const timeStr = (now.getHours() % 12 || 12) + ":" + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
    let totalClockWidth = 0;
    for (let char of timeStr) if (hugeFont[char]) totalClockWidth += hugeFont[char][0].length + 2;
    totalClockWidth -= 2;
    drawHugeText(timeStr, Math.floor((COLS - totalClockWidth) / 2), 10, currentColor);
    
    // 3. 下半部輪播
    const cycleTime = (Date.now() / 1000) % TOTAL_CYCLE;
    let currentPhase = 0;
    
    if (cycleTime < DURATION_PACMAN) {
        currentPhase = 1;
        const t = cycleTime;
        let pacmanX = 64 - (t * 4.6);
        let mouth = Math.floor(t * 4) % 2 === 0 ? 0 : 1;
        
        for (let dotC = 2; dotC < Math.round(pacmanX); dotC += 4) {
            drawLitDot(dotC, 38, '#555555');
        }
        drawSprite(pacmanMini[mouth], Math.round(pacmanX), 34, { '1': '#FFD700' });
        drawSprite(ghostMini, Math.round(pacmanX + 14), 34, { '1': '#FF69B4', '2': '#FFFFFF', '3': '#0026FF' });
        
    } else if (cycleTime < DURATION_PACMAN + DURATION_WEATHER) {
        currentPhase = 2;
        const tStr = isNaN(weatherTemp) ? "--°C" : Math.round(weatherTemp) + "°C";
        const hStr = isNaN(weatherHum) ? "--%" : Math.round(weatherHum) + "%";
        
        let tWidth = 0; for(let c of tStr) tWidth += (miniFont[c]||miniFont[' '])[0].length + 1; tWidth--;
        let hWidth = 0; for(let c of hStr) hWidth += (miniFont[c]||miniFont[' '])[0].length + 1; hWidth--;
        
        const GAP = 5;
        let startX = Math.floor((COLS - (11 + GAP + tWidth + GAP + hWidth)) / 2);
        
        drawSprite(getIconSprite(), startX, 33, { '1': '#FFD700', '2': '#FFFFFF', '3': '#00BFFF' });
        startX += 11 + GAP;
        
        startX = drawMiniText(tStr, startX, 36, '#FFFFFF');
        startX += GAP;
        
        drawMiniText(hStr, startX, 36, '#00BFFF');
        
    } else if (cycleTime < DURATION_PACMAN + DURATION_WEATHER + DURATION_MTR) {
        currentPhase = 3;
        const phaseElapsed = cycleTime - (DURATION_PACMAN + DURATION_WEATHER);
        const cached = textMatrixCache['mtr'];
        const textW = cached ? cached.width : 220;
        const progress = phaseElapsed / DURATION_MTR;
        const scrollX = 64 - progress * (textW + 64);
        
        drawRasterText('mtr', scrollX, 31, '#00F0FF');
        
    } else {
        currentPhase = 4;
        if (prevCyclePhase !== 4 && newsHeadlinePool.length > 0) {
            activeHeadlineIndex = (activeHeadlineIndex + 1) % newsHeadlinePool.length;
            renderActiveHeadline();
        }
        
        const phaseElapsed = cycleTime - (DURATION_PACMAN + DURATION_WEATHER + DURATION_MTR);
        const cached = textMatrixCache['news'];
        const textW = cached ? cached.width : 320;
        const progress = phaseElapsed / DURATION_NEWS;
        const scrollX = 64 - progress * (textW + 64);
        
        drawRasterText('news', scrollX, 31, '#FFB703');
    }
    
    prevCyclePhase = currentPhase;
    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
