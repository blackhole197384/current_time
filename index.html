<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tidbyt Style Matrix Panel</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        background-color: #000000;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        user-select: none;
        -webkit-user-select: none;
    }
    
    canvas {
        display: block;
        width: 100%;
        max-width: 100vw;
        max-height: 100vh;
        aspect-ratio: 2 / 1;
        object-fit: contain;
        /* Hardware accelerated outer LED glow */
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.22));
    }
</style>
</head>
<body>

<canvas id="matrixCanvas"></canvas>

<script>
// ==========================================
// 1. Exact Retina Grid Mapping (2048 x 1024)
// ==========================================
const COLS = 64;
const ROWS = 32;
const canvas = document.getElementById('matrixCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

// 2048 / 64 = 32 physical pixels per cell
const CELL_SIZE = 32; 
const DOT_SIZE = 24;  // 24px diameter LED
const DOT_GAP = 8;    // 8px pitch gap

canvas.width = COLS * CELL_SIZE;  // 2048 px
canvas.height = ROWS * CELL_SIZE; // 1024 px

// ==========================================
// 2. Offscreen Cache for the Unlit LED Grid
// ==========================================
const backplate = document.createElement('canvas');
backplate.width = canvas.width;
backplate.height = canvas.height;
const bgCtx = backplate.getContext('2d', { alpha: false });

bgCtx.fillStyle = '#050505';
bgCtx.fillRect(0, 0, backplate.width, backplate.height);

bgCtx.fillStyle = '#111111'; // Unlit hole color
for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
        let x = c * CELL_SIZE + CELL_SIZE / 2;
        let y = r * CELL_SIZE + CELL_SIZE / 2;
        bgCtx.beginPath();
        bgCtx.arc(x, y, DOT_SIZE / 2, 0, Math.PI * 2);
        bgCtx.fill();
    }
}

// ==========================================
// 3. Typography (17-High Clock & 5x5 Mini)
// ==========================================
const hugeFont = {
    '0': ['011111110','111111111','111000111','110000011','110000011','110000011','110000011','110000011','110000011','110000011','110000011','110000011','110000011','110000011','111000111','111111111','011111110'],
    '1': ['0001100','0011100','0111100','1101100','0001100','0001100','0001100','0001100','0001100','0001100','0001100','0001100','0001100','0001100','0001100','1111111','1111111'],
    '2': ['011111110','111111111','111000111','110000011','000000011','000000111','000001110','000011100','000111000','001110000','011100000','111000000','110000000','110000000','110000000','111111111','111111111'],
    '3': ['011111110','111111111','111000111','110000011','000000011','000000011','000000111','000111110','000111110','000000111','000000011','000000011','000000011','110000011','111000111','111111111','011111110'],
    '4': ['000000110','000001110','000011110','000110110','001100110','011000110','110000110','110000110','111111111','111111111','000000110','000000110','000000110','000000110','000000110','000000110','000000110'],
    '5': ['111111111','111111111','110000000','110000000','110000000','111111110','111111111','000000011','000000011','000000011','000000011','000000011','000000011','110000011','111000111','111111111','011111110'],
    '6': ['001111111','011111111','111000000','110000000','110000000','110000000','111111110','111111111','111000111','110000011','110000011','110000011','110000011','110000011','111000111','111111111','011111110'],
    '7': ['111111111','111111111','000000011','000000111','000001110','000011100','000111000','001110000','011100000','111000000','111000000','110000000','110000000','110000000','110000000','110000000','110000000'],
    '8': ['011111110','111111111','111000111','110000011','110000011','111000111','011111110','001111100','011111110','111000111','110000011','110000011','110000011','110000011','111000111','111111111','011111110'],
    '9': ['011111110','111111111','111000111','110000011','110000011','110000011','110000011','111000111','111111111','011111111','000000011','000000011','000000011','000000011','000000111','111111111','111111100'],
    ':': ['0000','0000','0000','0110','0110','0000','0000','0000','0000','0000','0000','0110','0110','0000','0000','0000','0000']
};

const miniFont = {
    '0': ['111','101','101','101','111'],
    '1': ['010','110','010','010','111'],
    '2': ['111','001','111','100','111'],
    '3': ['111','001','111','001','111'],
    '4': ['101','101','111','001','001'],
    '5': ['111','100','111','001','111'],
    '6': ['111','100','111','101','111'],
    '7': ['111','001','010','100','100'],
    '8': ['111','101','111','101','111'],
    '9': ['111','101','111','001','111'],
    'C': ['111','100','100','100','111'],
    '%': ['11001','11010','00100','01011','10011'],
    '-': ['000','000','111','000','000'],
    ' ': ['00','00','00','00','00'],
    '°': ['111','101','111','000','000']
};

const hourColors = ['#FF0000','#FF7F00','#FFD700','#7FFF00','#00FF00','#00FF7F','#00FFFF','#007FFF','#0000FF','#7F00FF','#FF00FF','#FF007F'];

// ==========================================
// 4. Sprites
// ==========================================
const pacmanMini = [
    ['001111000','011111100','111111110','111111111','111110000','111111111','111111110','011111100','001111000'],
    ['001111000','011111100','111111110','111111111','111111111','111111111','111111110','011111100','001111000']
];
const ghostMini = ['001111100','011111110','112212211','113213211','111111111','111111111','111111111','111111111','101010101'];

const iconSunny = [
    '00000100000','00100100100','00010001000','01001110010','00011111000',
    '11011111011','00011111000','01001110010','00010001000','00100100100','00000100000'
];
const iconCloudy = [
    '00000000000','00000222000','00002222200','00022222220','00222222220',
    '02222222222','02222222222','00222222200','00000000000','00000000000','00000000000'
];
const iconPartlyCloudy = [
    '00000100000','00100101000','00011110000','01011111000','00011222000',
    '00022222200','00222222220','02222222222','02222222222','00222222200','00000000000'
];
const iconRain = [
    '00002220000','00022222000','0022222220','02222222222','02222222222',
    '00222222200','00030030000','00300300300','00030030000','00300003000','00000000000'
];

// ==========================================
// 5. Data Fetching
// ==========================================
let weatherTemp = "--";
let weatherHum = "--";
let weatherIconCode = 52;

async function fetchWeather() {
    try {
        const hkoRes = await fetch("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc");
        const hkoData = await hkoRes.json();
        
        if (hkoData?.temperature?.data) {
            let t = hkoData.temperature.data.find(s => s.place.includes("將軍澳") || s.place.includes("康城")) || hkoData.temperature.data[0];
            if (t?.value !== undefined) weatherTemp = t.value;
        }
        if (hkoData?.icon?.length > 0) weatherIconCode = hkoData.icon[0];
        
        const omRes = await fetch("https://api.open-meteo.com/v1/forecast?latitude=22.296&longitude=114.271&current=relative_humidity_2m&timezone=Asia%2FHong_Kong");
        const omData = await omRes.json();
        if (omData?.current?.relative_humidity_2m !== undefined) {
            weatherHum = omData.current.relative_humidity_2m;
        } else if (hkoData?.humidity?.data) {
            weatherHum = hkoData.humidity.data[0].value;
        }
    } catch(e) {
        console.warn("Weather sync error:", e);
    }
}

fetchWeather();
setInterval(fetchWeather, 5 * 60 * 1000);

function getIconSprite() {
    if (weatherIconCode >= 50 && weatherIconCode <= 52) return iconPartlyCloudy;
    if (weatherIconCode >= 53 && weatherIconCode <= 54) return iconSunny;
    if (weatherIconCode >= 60 && weatherIconCode <= 61) return iconCloudy;
    if (weatherIconCode >= 62 && weatherIconCode <= 65) return iconRain;
    return iconPartlyCloudy;
}

// ==========================================
// 6. Fast Matrix Drawing Helpers
// ==========================================
function drawLitDot(col, row, color) {
    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;
    let x = col * CELL_SIZE + CELL_SIZE / 2;
    let y = row * CELL_SIZE + CELL_SIZE / 2;
    ctx.beginPath();
    ctx.arc(x, y, DOT_SIZE / 2, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
}

function drawSprite(sprite, startX, startY, colorMap) {
    for (let r = 0; r < sprite.length; r++) {
        for (let c = 0; c < sprite[r].length; c++) {
            if (sprite[r][c] !== '0') {
                drawLitDot(Math.floor(startX + c), startY + r, colorMap[sprite[r][c]] || '#FFFFFF');
            }
        }
    }
}

function drawHugeText(text, startX, startY, color) {
    let currX = startX;
    for (let i = 0; i < text.length; i++) {
        let charData = hugeFont[text[i]];
        if (!charData) { currX += 4; continue; }
        
        for (let r = 0; r < charData.length; r++) {
            for (let c = 0; c < charData[r].length; c++) {
                if (charData[r][c] === '1') drawLitDot(currX + c, startY + r, color);
            }
        }
        currX += charData[0].length + 2;
    }
}

function drawMiniText(text, startX, startY, color) {
    let currX = startX;
    for (let i = 0; i < text.length; i++) {
        let sprite = miniFont[text[i]] || miniFont[' '];
        for (let r = 0; r < sprite.length; r++) {
            for (let c = 0; c < sprite[r].length; c++) {
                if (sprite[r][c] === '1') drawLitDot(currX + c, startY + r, color);
            }
        }
        currX += sprite[0].length + 1;
    }
    return currX;
}

// ==========================================
// 7. Render Loop
// ==========================================
function animate() {
    // 1-op instant background blit
    ctx.drawImage(backplate, 0, 0);
    
    // --- TOP HALF: MASSIVE CLOCK ---
    const now = new Date();
    const timeStr = (now.getHours() % 12 || 12) + ":" + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
    const currentColor = hourColors[now.getHours() % 12];
    
    canvas.style.filter = `drop-shadow(0 0 10px ${currentColor}50)`;
    
    let totalWidth = 0;
    for (let char of timeStr) if (hugeFont[char]) totalWidth += hugeFont[char][0].length + 2;
    totalWidth -= 2;
    
    drawHugeText(timeStr, Math.floor((COLS - totalWidth) / 2), 1, currentColor);
    
    // --- BOTTOM HALF: 80s CYCLE (20s Pac-Man, 60s Weather) ---
    const modeTime = (Date.now() / 1000) % 80;
    
    if (modeTime < 20) {
        let pacmanX = 64 - (modeTime * 4.6);
        let mouth = Math.floor(modeTime * 4) % 2 === 0 ? 0 : 1;
        
        drawSprite(pacmanMini[mouth], Math.round(pacmanX), 21, { '1': '#FFD700' });
        drawSprite(ghostMini, Math.round(pacmanX + 14), 21, { '1': '#FF69B4', '2': '#FFFFFF', '3': '#0026FF' });
    } else {
        const tStr = isNaN(weatherTemp) ? "--°C" : Math.round(weatherTemp) + "°C";
        const hStr = isNaN(weatherHum) ? "--%" : Math.round(weatherHum) + "%";
        
        let tWidth = 0; for(let c of tStr) tWidth += (miniFont[c]||miniFont[' '])[0].length + 1; tWidth--;
        let hWidth = 0; for(let c of hStr) hWidth += (miniFont[c]||miniFont[' '])[0].length + 1; hWidth--;
        
        const GAP = 4;
        let startX = Math.floor((COLS - (11 + GAP + tWidth + GAP + hWidth)) / 2);
        
        drawSprite(getIconSprite(), startX, 20, { '1': '#FFD700', '2': '#FFFFFF', '3': '#00BFFF' });
        startX += 11 + GAP;
        
        startX = drawMiniText(tStr, startX, 23, '#FFFFFF');
        startX += (GAP - 1);
        
        drawMiniText(hStr, startX, 23, '#00BFFF');
    }
    
    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
