// ==========================================
// 4. 12px 點陣光柵化渲染器 (防裁切 + 自動垂直對齊)
// ==========================================
const textMatrixCache = {};

function rasterizeTextToMatrix(key, text) {
    if (!text) return;
    const off = document.createElement('canvas');
    const octx = off.getContext('2d', { willReadFrequently: true });
    
    // 使用 12px ArkPixel
    const fontStr = "12px 'ArkPixel12', sans-serif";
    octx.font = fontStr;
    const textWidth = Math.ceil(octx.measureText(text).width);
    
    // 預留 20px 垂直緩衝，徹底防止字體被內建行高裁切底部
    off.width = textWidth + 8;
    off.height = 20; 
    
    octx.fillStyle = "#000000";
    octx.fillRect(0, 0, off.width, off.height);
    
    octx.font = fontStr;
    octx.fillStyle = "#ffffff";
    octx.textBaseline = "top";
    octx.fillText(text, 2, 2);
    
    const imgData = octx.getImageData(0, 0, off.width, off.height);
    
    // 自動掃描實際文字起始 Y 軸
    let firstActiveY = -1;
    for (let y = 0; y < off.height; y++) {
        for (let x = 0; x < off.width; x++) {
            if (imgData.data[(y * off.width + x) * 4] > 60) {
                firstActiveY = y;
                break;
            }
        }
        if (firstActiveY !== -1) break;
    }
    if (firstActiveY === -1) firstActiveY = 2;

    const TARGET_HEIGHT = 12;
    const dots = [];
    for (let x = 0; x < off.width; x++) {
        dots[x] = [];
        for (let r = 0; r < TARGET_HEIGHT; r++) {
            const actualY = firstActiveY + r;
            if (actualY < off.height) {
                const idx = (actualY * off.width + x) * 4;
                dots[x][r] = imgData.data[idx] > 60 ? 1 : 0;
            } else {
                dots[x][r] = 0;
            }
        }
    }
    
    textMatrixCache[key] = {
        width: off.width,
        height: TARGET_HEIGHT,
        dots: dots
    };
}
