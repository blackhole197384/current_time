<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Modern Flip Clock & Smart Dashboard</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 60% 40%, #00709b 0%, #02466b 40%, #011b2b 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", "Noto Sans TC", sans-serif;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        user-select: none;
        -webkit-user-select: none;
    }

    /* 護屏模式背景圖層 */
    #screensaver-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-size: cover;
        background-position: center;
        opacity: 0;
        transition: opacity 1.5s ease-in-out;
        z-index: 100;
        pointer-events: none;
    }

    /* 主儀表板容器 (iPad 4:3 比例) */
    .dashboard-container {
        width: 100vw;
        height: 100vh;
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 4 / 3;
        display: flex;
        flex-direction: column;
        padding: 3vw;
        transition: opacity 1s ease-in-out;
        z-index: 10;
        position: relative;
    }

    /* ==========================================
       1. 上半部：翻牌時鐘 (佔 3/5 高度)
       ========================================== */
    .upper-part {
        flex: 3; 
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    .flip-clock-wrapper {
        display: flex;
        align-items: center;
        gap: 1vw;
        margin-bottom: 2.2vw;
    }

    .flip-card {
        position: relative;
        width: 16vw;
        height: 24vw;
        background-color: #1a2733;
        border-radius: 1.5vw;
        box-shadow: 0 1vw 2vw rgba(0,0,0,0.5), inset 0 0.2vw 0.5vw rgba(255,255,255,0.1);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20vw;
        font-weight: 600;
        color: #ffffff;
        overflow: hidden;
    }

    /* 物理中縫切割線 */
    .flip-card::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        height: 2px;
        background-color: #0b141d;
        transform: translateY(-50%);
        box-shadow: 0 1px 1px rgba(255,255,255,0.05);
        z-index: 10;
    }

    /* 兩側鉸鏈內凹細節 */
    .flip-card::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        height: 1.5vw;
        background: transparent;
        transform: translateY(-50%);
        border-left: 0.6vw solid #0b141d;
        border-right: 0.6vw solid #0b141d;
        z-index: 11;
    }

    .flip-card-inner {
        position: relative;
        z-index: 5;
        margin-top: -0.5vw;
    }

    .colon {
        font-size: 16vw;
        font-weight: 600;
        color: #c0e8f0;
        margin: 0 0.5vw;
        transform: translateY(-1vw);
    }

    /* 中文年月日與星期 */
    .date-display {
        position: absolute;
        right: 4.5vw;
        bottom: 1.5vw;
        font-size: 1.9vw;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.82);
        letter-spacing: 0.04em;
        white-space: nowrap;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .divider {
        height: 1px;
        width: 90%;
        margin: 0 auto 2vw auto;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    }

    /* ==========================================
       2. 下半部：資訊輪播區 (佔 2/5 高度)
       ========================================== */
    .bottom-part {
        flex: 2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 4vw;
    }

    .meta-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 2.2vw;
        font-weight: 600;
        color: #fca311;
        margin-bottom: 1.5vw;
    }

    .source-tag {
        display: flex;
        align-items: center;
        gap: 0.8vw;
    }

    .source-dot {
        width: 1.2vw;
        height: 1.2vw;
        border-radius: 50%;
        background-color: #fca311;
        box-shadow: 0 0 8px rgba(252,163,17,0.5);
        transition: background-color 0.4s ease;
    }

    /* 開獎日紅黃交替閃爍燈效 */
    @keyframes pulse-dot {
        0%, 100% {
            background-color: #ff3b30;
            box-shadow: 0 0 8px #ff3b30, 0 0 16px rgba(255, 59, 48, 0.6);
            transform: scale(1);
        }
        50% {
            background-color: #ffd60a;
            box-shadow: 0 0 12px #ffd60a, 0 0 24px rgba(255, 214, 10, 0.8);
            transform: scale(1.25);
        }
    }

    .pulse-today {
        animation: pulse-dot 1s infinite alternate !important;
    }

    .message-card {
        display: flex;
        flex-direction: column;
        gap: 0.6vw; 
    }

    .message-text {
        font-size: 3vw; 
        font-weight: 500;
        color: #ffffff;
        line-height: 1.35;
        letter-spacing: 0.02em;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .message-text span.highlight {
        color: #fca311;
    }

    .message-text.visible {
        opacity: 1;
        transform: translateY(0);
    }

    /* ==========================================
       3. 六合彩 彩球與頭獎高亮樣式
       ========================================== */
    .balls-row {
        display: inline-flex;
        align-items: center;
        gap: 0.6vw;
        margin-top: 0.2vw;
    }

    .ms-ball {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 3.8vw;
        height: 3.8vw;
        border-radius: 50%;
        font-size: 2.1vw;
        font-weight: 700;
        color: #ffffff;
        box-shadow: 0 0.4vw 0.8vw rgba(0, 0, 0, 0.6), inset 0 0.3vw 0.3vw rgba(255, 255, 255, 0.45);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        vertical-align: middle;
    }

    .ms-red   { background: radial-gradient(circle at 35% 35%, #ff5252 0%, #d50000 70%, #8b0000 100%); }
    .ms-blue  { background: radial-gradient(circle at 35% 35%, #40c4ff 0%, #0091ea 70%, #01579b 100%); }
    .ms-green { background: radial-gradient(circle at 35% 35%, #69f0ae 0%, #00c853 70%, #00600f 100%); }

    .ms-plus {
        font-size: 2.4vw;
        margin: 0 0.4vw;
        color: #ffd60a;
        font-weight: 600;
        text-shadow: 0 0 6px rgba(255, 214, 10, 0.5);
    }

    /* 超過 3000 萬 / 金多寶的醒目呼吸紅黃提示 */
    @keyframes pulse-glow {
        0%, 100% {
            color: #ff3b30;
            text-shadow: 0 0 10px rgba(255, 59, 48, 0.8), 0 0 20px rgba(255, 59, 48, 0.4);
        }
        50% {
            color: #ffd60a;
            text-shadow: 0 0 14px rgba(255, 214, 10, 0.9), 0 0 25px rgba(255, 214, 10, 0.6);
        }
    }

    .high-jackpot {
        animation: pulse-glow 2s infinite alternate;
        font-weight: 700 !important;
    }
</style>
</head>
<body>

<div id="screensaver-layer"></div>

<div class="dashboard-container" id="dashboard-main">
    <div class="upper-part">
        <div class="flip-clock-wrapper">
            <div class="flip-card"><div class="flip-card-inner" id="h1">0</div></div>
            <div class="flip-card"><div class="flip-card-inner" id="h2">0</div></div>
            <div class="colon">:</div>
            <div class="flip-card"><div class="flip-card-inner" id="m1">0</div></div>
            <div class="flip-card"><div class="flip-card-inner" id="m2">0</div></div>
        </div>
        <div class="date-display" id="dateDisplay">載入中...</div>
    </div>

    <div class="divider"></div>

    <div class="bottom-part">
        <div class="meta-row">
            <div class="source-tag">
                <span class="source-dot" id="sourceDot"></span>
                <span id="sourceLabel">系統啟動中</span>
            </div>
            <div id="timeLabel">--:--</div>
        </div>
        <div class="message-card">
            <div class="message-text" id="msgLine1"><span class="highlight">歡迎使用</span> 智慧儀表板</div>
            <div class="message-text" id="msgLine2">正在連線並同步資料...</div>
            <div class="message-text" id="msgLine3"></div>
        </div>
    </div>
</div>

<script>
// ==========================================
// 1. 翻牌時鐘與中文日期更新
// ==========================================
function updateClock() {
    const now = new Date();
    let hours = now.getHours() % 12 || 12;
    const hStr = String(hours).padStart(2, '0');
    const mStr = String(now.getMinutes()).padStart(2, '0');
    
    document.getElementById('h1').textContent = hStr[0];
    document.getElementById('h2').textContent = hStr[1];
    document.getElementById('m1').textContent = mStr[0];
    document.getElementById('m2').textContent = mStr[1];
    
    const year = now.getFullYear();
    const month = now.getMonth() + 1;
    const date = now.getDate();
    const weekDaysZh = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    
    document.getElementById('dateDisplay').textContent = `${year} 年${month} 月${date} 日, ${weekDaysZh[now.getDay()]}`;
}
setInterval(updateClock, 1000);
updateClock();

// ==========================================
// 2. 六合彩彩球分類對照表
// ==========================================
const RED_BALLS   = [1, 2, 7, 8, 12, 13, 18, 19, 23, 24, 29, 30, 34, 35, 40, 45, 46];
const BLUE_BALLS  = [3, 4, 9, 10, 14, 15, 20, 25, 26, 31, 36, 37, 41, 42, 47, 48];
const GREEN_BALLS = [5, 6, 11, 16, 17, 21, 22, 27, 28, 32, 33, 38, 39, 43, 44, 49];

function getBallClass(num) {
    const n = parseInt(num, 10);
    if (RED_BALLS.includes(n)) return 'ms-red';
    if (BLUE_BALLS.includes(n)) return 'ms-blue';
    return 'ms-green';
}

function renderBallHtml(num) {
    if (!num || num === "--") {
        return `<span class="ms-ball" style="background:#334155; color:#94a3b8;">--</span>`;
    }
    const padded = String(num).padStart(2, '0');
    return `<span class="ms-ball ${getBallClass(num)}">${padded}</span>`;
}

// ==========================================
// 3. 資料獲取區 (天氣、港鐵、城巴790、新聞、六合彩)
// ==========================================
let weatherData = { temp: "--", hum: "--" };
let mtrSchedule = ["暫無列車資訊", "", ""];
let ctb790Schedule = ["正在讀取城巴 790 班次...", "", ""];
let newsHeadlines = [["<span class='highlight'>即時要聞</span> 載入中", "請稍候..."]];
let ctbStopId = null;

// 六合彩資料模型
let markSixData = {
    drawNo: "載入中",
    numbers: ["--", "--", "--", "--", "--", "--"],
    special: "--",
    prizes: {
        first: "載入中...",
        second: "--",
        third: "--"
    },
    nextDraw: {
        rawDateStr: "", 
        date: "載入中...",
        jackpotAmount: 0,
        jackpotText: "--",
        isSnowball: false
    }
};

async function fetchWeather() {
    try {
        const hkoRes = await fetch("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc");
        const hkoData = await hkoRes.json();
        if (hkoData?.temperature?.data) {
            let t = hkoData.temperature.data.find(s => s.place.includes("將軍澳") || s.place.includes("康城")) || hkoData.temperature.data[0];
            weatherData.temp = t ? t.value : "--";
        }
        if (hkoData?.humidity?.data) {
            weatherData.hum = hkoData.humidity.data[0].value + "%";
        }
    } catch(e) {}
}

async function fetchMTR() {
    try {
        const res = await fetch("https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TKL&sta=LHP");
        const json = await res.json();
        if (json.status === 1 && json.data && json.data["TKL-LHP"]) {
            const departures = (json.data["TKL-LHP"].DOWN || []).concat(json.data["TKL-LHP"].UP || []).filter(t => t.dest !== 'LHP');
            if (departures.length > 0) {
                const destNames = { 'NOP': '北角', 'TIK': '調景嶺', 'POA': '寶琳', 'TKO': '將軍澳' };
                mtrSchedule = departures.slice(0, 3).map((t, i) => {
                    const dest = destNames[t.dest] || t.dest;
                    const mins = parseInt(t.ttnt, 10);
                    const label = (mins === 0) ? "即將開出" : `<span class='highlight'>${mins} 分鐘後</span>`;
                    return `第 ${i + 1} 班往${dest}：${label}`;
                });
                while(mtrSchedule.length < 3) mtrSchedule.push("");
            } else {
                mtrSchedule = ["暫無即將開出的列車", "", ""];
            }
        }
    } catch(e) {}
}

async function fetchCTB790() {
    try {
        if (!ctbStopId) {
            const routeRes = await fetch("https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/790/outbound");
            const routeJson = await routeRes.json();
            if (routeJson?.data) {
                const stopItem = routeJson.data.find(s => parseInt(s.seq, 10) === 4) || routeJson.data[3];
                if (stopItem) ctbStopId = stopItem.stop;
            }
        }

        if (!ctbStopId) return;

        const etaRes = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${ctbStopId}/790`);
        const etaJson = await etaRes.json();

        if (etaJson?.data) {
            const now = new Date();
            const validEtas = etaJson.data
                .filter(item => item.dir === 'O' && item.eta)
                .sort((a, b) => new Date(a.eta) - new Date(b.eta))
                .slice(0, 3);

            if (validEtas.length > 0) {
                ctb790Schedule = validEtas.map((item, i) => {
                    const etaTime = new Date(item.eta);
                    const diffMins = Math.max(0, Math.round((etaTime - now) / 60000));
                    const label = (diffMins === 0) ? "即將抵達" : `<span class='highlight'>${diffMins} 分鐘後</span>`;
                    const remark = item.rmk_tc ? ` <span style="font-size:0.85em; opacity:0.7;">(${item.rmk_tc})</span>` : "";
                    return `第 ${i + 1} 班車：${label}${remark}`;
                });
                while(ctb790Schedule.length < 3) ctb790Schedule.push("");
            } else {
                ctb790Schedule = ["今日服務已結束或暫無即時班次", "往 尖沙咀 (麼地道)", ""];
            }
        }
    } catch(e) {
        ctb790Schedule = ["城巴 790 線暫時無法連線", "", ""];
    }
}

async function fetchNews() {
    try {
        const rssUrl = encodeURIComponent("https://rthk9.rthk.hk/rthk/news/rss/c_expressnews_clocal.xml");
        const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`);
        const data = await res.json();
        if (data.status === 'ok' && data.items && data.items.length > 0) {
            newsHeadlines = data.items.slice(0, 8).map(item => {
                const rawTitle = item.title.replace(/<[^>]*>?/gm, '').trim();
                let highlightPrefix = rawTitle.length > 4 ? `<span class='highlight'>${rawTitle.substring(0, 4)}</span>` : `<span class='highlight'>${rawTitle}</span>`;
                let remaining = rawTitle.length > 4 ? rawTitle.substring(4) : "";
                
                if (rawTitle.length > 16) {
                    return [
                        highlightPrefix + rawTitle.substring(4, 16),
                        rawTitle.substring(16, 32) + (rawTitle.length > 32 ? "…" : "")
                    ];
                }
                return [highlightPrefix + remaining, ""];
            });
        }
    } catch(e) {}
}

async function fetchMarkSix() {
    const target = "https://bet.hkjc.com/marksix/getJSON.aspx?jsontype=last_and_next_draw";
    const proxyList = [
        `https://corsproxy.io/?${encodeURIComponent(target)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`
    ];

    for (const url of proxyList) {
        try {
            const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
            if (!res.ok) continue;
            const data = await res.json();
            
            if (data?.lastDraw) {
                markSixData.drawNo = data.lastDraw.id || markSixData.drawNo;
                if (data.lastDraw.result) {
                    const parts = data.lastDraw.result.split(',');
                    if (parts.length >= 7) {
                        markSixData.numbers = parts.slice(0, 6);
                        markSixData.special = parts[6];
                    }
                }
                if (data.lastDraw.prizes) {
                    const p1 = data.lastDraw.prizes[0];
                    markSixData.prizes.first = (p1 && parseInt(p1.count, 10) > 0)
                        ? `$${Number(p1.amount).toLocaleString()} (${p1.count}注)` 
                        : "無人中";
                    markSixData.prizes.second = data.lastDraw.prizes[1] 
                        ? `$${Number(data.lastDraw.prizes[1].amount).toLocaleString()}` 
                        : "--";
                    markSixData.prizes.third = data.lastDraw.prizes[2] 
                        ? `$${Number(data.lastDraw.prizes[2].amount).toLocaleString()}` 
                        : "--";
                }
            }

            if (data?.nextDraw) {
                markSixData.nextDraw.rawDateStr = data.nextDraw.date || "";
                
                if (data.nextDraw.date) {
                    const dParts = data.nextDraw.date.split('/');
                    if (dParts.length === 3) {
                        const drawDay = new Date(parseInt(dParts[2]), parseInt(dParts[1]) - 1, parseInt(dParts[0]));
                        const weekDaysZh = ['日', '一', '二', '三', '四', '五', '六'];
                        markSixData.nextDraw.date = `${parseInt(dParts[1])}月${parseInt(dParts[0])}日 (星期${weekDaysZh[drawDay.getDay()]})`;
                    } else {
                        markSixData.nextDraw.date = data.nextDraw.date;
                    }
                }

                const pool = parseInt(data.nextDraw.jackpot || 0, 10);
                markSixData.nextDraw.jackpotAmount = pool;
                markSixData.nextDraw.jackpotText = pool > 0 ? `$${pool.toLocaleString()}` : "$8,000,000";
                markSixData.nextDraw.isSnowball = !!data.nextDraw.snowball;
            }

            break;
        } catch (err) {}
    }
}

fetchWeather();
fetchMTR();
fetchCTB790();
fetchNews();
fetchMarkSix();

setInterval(fetchWeather, 5 * 60 * 1000);
setInterval(fetchMTR, 30 * 1000);
setInterval(fetchCTB790, 30 * 1000);
setInterval(fetchNews, 8 * 60 * 1000);
setInterval(fetchMarkSix, 15 * 60 * 1000);

// ==========================================
// 4. 護屏模式 (每 5 分鐘執行 20 秒)
// ==========================================
const screenSaverLayer = document.getElementById('screensaver-layer');
const dashboardMain = document.getElementById('dashboard-main');
let isScreenSaverMode = false;
let nextBgImageUrl = "";

function preloadNextImage() {
    const ts = new Date().getTime(); 
    nextBgImageUrl = `https://picsum.photos/2048/1536?random=${ts}`;
    const img = new Image();
    img.src = nextBgImageUrl;
}
preloadNextImage();

function startScreenSaver() {
    isScreenSaverMode = true;
    screenSaverLayer.style.backgroundImage = `url('${nextBgImageUrl}')`;
    
    dashboardMain.style.opacity = '0';
    screenSaverLayer.style.opacity = '1';

    setTimeout(() => {
        screenSaverLayer.style.opacity = '0';
        dashboardMain.style.opacity = '1';
        isScreenSaverMode = false;
        setTimeout(preloadNextImage, 5000);
    }, 20000);
}

setInterval(startScreenSaver, 5 * 60 * 1000);

// ==========================================
// 5. 5 階段資訊輪播邏輯 (總週期 80 秒)
// ==========================================
function updateMessageDisplay(source, time, line1, line2, line3 = "", isPulsing = false) {
    if (isScreenSaverMode) return; 

    const l1 = document.getElementById('msgLine1');
    const l2 = document.getElementById('msgLine2');
    const l3 = document.getElementById('msgLine3');
    const src = document.getElementById('sourceLabel');
    const tLabel = document.getElementById('timeLabel');
    const dot = document.getElementById('sourceDot');

    l1.classList.remove('visible');
    l2.classList.remove('visible');
    l3.classList.remove('visible');

    setTimeout(() => {
        src.innerHTML = source;
        tLabel.textContent = time;
        l1.innerHTML = line1;
        l2.innerHTML = line2;
        l3.innerHTML = line3;

        if (isPulsing) {
            dot.classList.add('pulse-today');
        } else {
            dot.classList.remove('pulse-today');
        }

        l1.classList.add('visible');
        if (line2) l2.classList.add('visible');
        if (line3) l3.classList.add('visible');
    }, 850);
}

function runInfoCycle() {
    const now = new Date();
    const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    
    // Step 1 (0s): 天氣 (持續 20 秒)
    updateMessageDisplay(
        "香港天文台 即時天氣",
        timeStr,
        `將軍澳氣溫 <span class='highlight'>${weatherData.temp}°C</span>`,
        `相對濕度 <span class='highlight'>${weatherData.hum}</span>`,
        ""
    );

    // Step 2 (20s): 港鐵 (持續 15 秒)
    setTimeout(() => {
        if (isScreenSaverMode) return;
        updateMessageDisplay(
            "MTR 港鐵 康城站班次",
            timeStr,
            mtrSchedule[0] || "",
            mtrSchedule[1] || "",
            mtrSchedule[2] || ""
        );
    }, 20000);

    // Step 3 (35s): 城巴 790 峻瀅站 (持續 10 秒)
    setTimeout(() => {
        if (isScreenSaverMode) return;
        updateMessageDisplay(
            "城巴 790 往尖沙咀 (麼地道)",
            "峻瀅站 · 到站預報",
            ctb790Schedule[0] || "",
            ctb790Schedule[1] || "",
            ctb790Schedule[2] || ""
        );
    }, 35000);

    // Step 4 (45s): 即時新聞 (持續 20 秒)
    setTimeout(() => {
        if (isScreenSaverMode) return;
        const news = newsHeadlines[Math.floor(Math.random() * newsHeadlines.length)] || ["即時要聞讀取中", ""];
        updateMessageDisplay(
            "香港電台 即時要聞 RTHK",
            timeStr,
            news[0],
            news[1],
            ""
        );
    }, 45000);

    // Step 5 (65s): 六合彩 上期結果與下期頭獎 (持續 15 秒)
    setTimeout(() => {
        if (isScreenSaverMode) return;

        // 精確比對今日日期是否與「下期攪珠日」相符
        let isTodayDraw = false;
        if (markSixData.nextDraw.rawDateStr) {
            const todayStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()}`;
            isTodayDraw = (markSixData.nextDraw.rawDateStr === todayStr);
        }

        let sourceTitle = `香港賽馬會 六合彩 (第 ${markSixData.drawNo} 期)`;
        let rightMeta = "攪珠結果";
        if (isTodayDraw) {
            sourceTitle = `六合彩 Mark Six · <span style="color:#ffd60a;">今日攪珠 (晚上9:15截止)</span>`;
            rightMeta = "今晚開彩";
        }

        // 第 1 行：經典紅/藍/綠彩球圓圈 + 特別號碼
        const ballsHtml = markSixData.numbers.map(n => renderBallHtml(n)).join('') 
                        + `<span class="ms-plus">+</span>` 
                        + renderBallHtml(markSixData.special);
        const line1 = `<div class="balls-row">${ballsHtml}</div>`;

        // 第 2 行：前三獎派彩金額
        const line2 = `頭獎: <span class='highlight'>${markSixData.prizes.first}</span> · 二獎: ${markSixData.prizes.second} · 三獎: ${markSixData.prizes.third}`;

        // 第 3 行：下期攪珠日期與頭獎 (超過 3000 萬或金多寶觸發呼吸紅黃色)
        const isHighJackpot = markSixData.nextDraw.jackpotAmount >= 30000000 || markSixData.nextDraw.isSnowball;
        const jackpotClass = isHighJackpot ? "high-jackpot" : "highlight";
        const snowballBadge = markSixData.nextDraw.isSnowball ? " [金多寶]" : "";
        const line3 = `下期攪珠: ${markSixData.nextDraw.date} · 估計頭獎 <span class="${jackpotClass}">${markSixData.nextDraw.jackpotText}${snowballBadge}</span>`;

        updateMessageDisplay(
            sourceTitle,
            rightMeta,
            line1,
            line2,
            line3,
            isTodayDraw
        );
    }, 65000);
}

// 首次啟動與設定每 80 秒一圈的循環 (20s + 15s + 10s + 20s + 15s = 80s)
setTimeout(() => {
    runInfoCycle();
    setInterval(runInfoCycle, 80000);
}, 500);

</script>
</body>
</html>
